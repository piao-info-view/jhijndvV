  document.head.append(style);
  const screen = document.getElementById(showInvoice ? 'detail' : 'home');
  document.body.replaceChildren(screen.content.cloneNode(true));
  if (showInvoice) {
    (function(){
  'use strict';
  const fields=document.getElementById('fields'), empty=document.getElementById('empty');
  function fail(message){empty.hidden=false;document.getElementById('empty-text').textContent=message;document.getElementById('invoice').hidden=true;}
  function read(){
    try{
      const encoded=new URLSearchParams(location.hash.slice(1)).get('i');
      if(!encoded){fail('请扫描发票信息二维码查看对应内容。');return;}
      if(encoded.length>1500)throw new Error('length');
      const raw=atob(encoded.replace(/-/g,'+').replace(/_/g,'/'));
      const data=JSON.parse(new TextDecoder().decode(Uint8Array.from(raw,c=>c.charCodeAt(0))));
      if(data.v!==1||!['modern','legacy'].includes(data.t)||!/^\d{8}$|^\d{20}$/.test(data.n)||!/^\d{4}\.\d{2}\.\d{2}$/.test(data.d)||!/^\d{1,10}\.\d{2}$/.test(data.a))throw new Error('fields');
      const [y,m,d]=data.d.split('.').map(Number), date=new Date(Date.UTC(y,m-1,d));
      if(date.getUTCFullYear()!==y||date.getUTCMonth()!==m-1||date.getUTCDate()!==d)throw new Error('date');
      if(data.t==='legacy'&&(!/^\d{10,12}$/.test(data.c)||!/^\d{20}$/.test(data.k)||data.n.length!==8))throw new Error('legacy');
      if(data.t==='modern'&&data.n.length!==20)throw new Error('modern');
      fields.replaceChildren();
      const add=(label,value,money=false)=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;if(money){dd.className='amount';dd.append(document.createTextNode('¥'+data.a));const strong=document.createElement('strong');strong.textContent=data.t==='legacy'?'(不含税)':'(含税)';dd.append(strong);}else{dd.textContent=value;}fields.append(dt,dd);};
      if(data.t==='legacy')add('发票代码',data.c);
      add('发票号码',data.n);add('合计金额','',true);add('开票日期',data.d);
      if(data.t==='legacy')add('发票校验码',data.k);
      empty.hidden=true;document.getElementById('invoice').hidden=false;
      document.title='发票信息';
    }catch(error){fail('二维码信息不完整或格式有误，请重新扫描正确的信息展示码。');}
  }
  const menuButton = document.getElementById('more');
  const menu = document.getElementById('page-menu');
  const status = document.getElementById('viewer-status');
  const inWeChat = /MicroMessenger/i.test(navigator.userAgent);
  let statusTimer;
  let closeTimer;

  function setMenu(open) {
    menu.hidden = !open;
    menuButton.setAttribute('aria-expanded', String(open));
    if (open) status.textContent = '';
  }

  function showStatus(message) {
    clearTimeout(statusTimer);
    status.textContent = message;
    statusTimer = setTimeout(() => { status.textContent = ''; }, 4500);
  }

  menuButton.addEventListener('click', () => setMenu(menu.hidden));
  document.getElementById('share-page').addEventListener('click', async () => {
    setMenu(false);
    menuButton.focus();
    const hint = inWeChat ? '请点微信顶部的 ⋯ 分享' : '请使用浏览器的分享功能';
    if (typeof navigator.share !== 'function') {
      showStatus(hint);
      return;
    }
    try {
      await navigator.share({ title: document.title, url: location.href });
    } catch (error) {
      if (error.name !== 'AbortError') showStatus(hint);
    }
  });
  document.getElementById('close').addEventListener('click', () => {
    setMenu(false);
    status.textContent = '';
    clearTimeout(closeTimer);
    const hint = inWeChat ? '请点微信左上角的 × 关闭' : '请使用浏览器的关闭按钮';
    try {
      const bridge = window.WeixinJSBridge;
      if (inWeChat && typeof bridge?.call === 'function') {
        bridge.call('closeWindow');
      } else {
        window.close();
      }
    } catch {
      showStatus(hint);
      return;
    }
    closeTimer = setTimeout(() => {
      if (!window.closed && !document.hidden && menu.hidden) showStatus(hint);
    }, 600);
  });
  window.addEventListener('pagehide', () => clearTimeout(closeTimer));
  window.addEventListener('click', event => {
    if (!menu.hidden && !menu.contains(event.target) && !menuButton.contains(event.target)) setMenu(false);
  });
  window.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !menu.hidden) {
      setMenu(false);
      menuButton.focus();
    }
  });
  window.addEventListener('hashchange',read);read();
})();

  }
})();
